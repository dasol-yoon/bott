# CPU-only environment spec for BOTT. Resolves on linux-64, win-64, osx-64 and
# osx-arm64. This is the only option on macOS, which has no CUDA support.
#
#     conda env create -f environment-cpu.yml
#     conda activate bott-cpu
#
# Pass device_simu='cpu' everywhere. abTEM multislice simulation is roughly
# 5-7x slower than on a CUDA GPU, and it dominates the runtime of a BO run.
#
# Note on Apple Silicon: PyTorch's MPS backend does not support float64, and
# this codebase uses dtype=torch.float64 throughout, so BoTorch has to stay on
# CPU. abTEM has no MPS path at all. MPS therefore buys nothing here.
#
# The `=*=cpu*` build pin is load-bearing: a bare `- pytorch` lets the solver
# pick the newest build, which on Linux and Windows is a CUDA one.
name: bott-cpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=*=cpu*
  - numpy<2
  - abtem=1.0.6
  - ase
  - dask
  - botorch=0.13
  - gpytorch
  - scipy
  - matplotlib
  - tifffile
  - pillow
  - pyyaml
  - psutil
  - ipykernel
  - ipympl
